<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAMA CAFE</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== TOKEN: ganti di sini saja untuk brand baru ===== */
:root{--bg:#F2F5F0;--ink:#14231E;--brand:#4D553F;--accent:#ED4B91;--card:#fff;--muted:#5C6B65;--r:18px;
--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 16px/1.6 var(--fb);background:var(--bg);color:var(--ink);padding-bottom:84px}
h1,h2,h3{font-family:var(--fd);line-height:1.05}
section{padding:64px 20px;max-width:1040px;margin:auto}
h2{font-size:clamp(28px,6vw,44px);margin-bottom:24px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(242,245,240,.9);backdrop-filter:blur(8px)}
nav b{font:800 20px var(--fd)}nav a{color:var(--ink);text-decoration:none;margin-left:16px;font-weight:600}
.btn{display:inline-block;border:0;border-radius:99px;padding:14px 26px;font:600 16px var(--fb);cursor:pointer;background:var(--accent);color:var(--ink);text-decoration:none;transition:transform .2s}
.btn:active{transform:scale(.95)}.btn.alt{background:transparent;border:2px solid #fff;color:#fff}
/* HERO */
.hero{background:var(--brand);color:#fff;max-width:none;padding:96px 20px 72px}
.hero div{max-width:1040px;margin:auto}
.hero h1{font-size:clamp(44px,11vw,104px);font-weight:800;max-width:11ch}
.w{display:inline-block;opacity:0;transform:translateY(40px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.hero p{margin:20px 0 28px;max-width:46ch;opacity:0;animation:up .7s .9s forwards}
.hero .btn{opacity:0;animation:up .7s 1.1s forwards;margin-right:8px}
/* MARQUEE */
.mq{background:var(--accent);overflow:hidden;white-space:nowrap;padding:14px 0;font:800 20px var(--fd)}
.mq span{display:inline-block;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
/* MENU */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:12px}
.tab{flex:none;border:2px solid var(--brand);background:none;border-radius:99px;padding:8px 18px;font:600 15px var(--fb);cursor:pointer;color:var(--brand)}
.tab.on{background:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--brand),#3b6a5c);display:grid;place-items:center;color:#fff;font:800 48px var(--fd)}
.ph img{width:100%;height:100%;object-fit:cover}
.card div.i{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card p{color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.tag{font-size:12px;background:var(--accent);padding:2px 10px;border-radius:99px;font-weight:600;align-self:flex-start}
.add{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:22px;cursor:pointer;transition:transform .2s}
.add.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35) rotate(90deg)}}
.rv{opacity:0;transform:translateY(24px);transition:.6s}.rv.in{opacity:1;transform:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gal .ph{border-radius:var(--r);aspect-ratio:1}
/* CART */
#bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:var(--brand);color:#fff;border-radius:99px;padding:14px 22px;display:none;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#bar.show{display:flex;animation:up .4s}#bar.bump{animation:pop .35s}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#sheet.open{display:flex}
#sheet>div{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:24px;max-height:88vh;overflow:auto;animation:up .35s}
#sheet input,#sheet textarea{width:100%;padding:12px;border:2px solid #dde3df;border-radius:12px;font:inherit;margin:6px 0 12px}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
.li button{border:1px solid #ccc;background:#fff;border-radius:8px;width:30px;cursor:pointer}
footer{background:var(--brand);color:#fff;text-align:center;padding:32px 20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.w,.hero p,.hero .btn,.rv{opacity:1;transform:none}}
</style>
</head>

const card=(m,i)=>`<div class="card"><div class="ph">${m.img?`<img loading="lazy" src="${m.img}" alt="${m.name}">`:m.name[0]}</div><div class="i">${m.best?'<span class="tag">Best seller</span>':''}<h3>${m.name}</h3><p>${m.desc}</p><div class="row"><b>${rp(m.price)}</b><button class="add" aria-label="Tambah ${m.name}" data-i="${i}">+</button></div></div></div>`;
function drawMenu(){
 $("tabs").innerHTML=[...new Set(C.menu.map(m=>m.cat))].map(c=>`<button class="tab ${c==cat?'on':''}" data-c="${c}">${c}</button>`).join("");
 $("menuGrid").innerHTML=C.menu.map((m,i)=>m.cat==cat?card(m,i):"").join("");
}
$("sigGrid").innerHTML=C.menu.map((m,i)=>m.best?card(m,i):"").join("");drawMenu();
function drawCart(){
 const ids=Object.keys(cart).filter(i=>cart[i]>0),n=ids.reduce((s,i)=>s+cart[i],0),t=ids.reduce((s,i)=>s+cart[i]*C.menu[i].price,0);
 $("bar").classList.toggle("show",n>0);$("barN").textContent=n+" item";$("barT").textContent=rp(t);$("tot").textContent="Total "+rp(t);
 $("items").innerHTML=ids.map(i=>`<div class="li"><span>${C.menu[i].name}</span><span><button data-m="${i}">−</button> ${cart[i]} <button data-p="${i}">+</button></span></div>`).join("");
 if(!n)$("sheet").classList.remove("open");
 return{ids,t};
}
document.addEventListener("click",e=>{
 const t=e.target;
 if(t.dataset.c){cat=t.dataset.c;drawMenu()}
 if(t.dataset.i){cart[t.dataset.i]=(cart[t.dataset.i]||0)+1;t.classList.add("pop");setTimeout(()=>t.classList.remove("pop"),350);drawCart();$("bar").classList.remove("bump");void $("bar").offsetWidth;$("bar").classList.add("bump")}
 if(t.dataset.p){cart[t.dataset.p]++;drawCart()}
 if(t.dataset.m){cart[t.dataset.m]--;drawCart()}
 if(t.closest("#bar"))$("sheet").classList.add("open");
 if(t.id=="close"||t.id=="sheet")$("sheet").classList.remove("open");
});
$("send").onclick=()=>{
 const{ids,t}=drawCart();if(!ids.length)return;
 if(!$("meja").value.trim()){$("meja").focus();return}
 const msg=`Halo ${C.name}, pesanan Meja ${$("meja").value}:\n`+ids.map(i=>`- ${cart[i]}x ${C.menu[i].name}`).join("\n")+(($("note").value)?`\nCatatan: ${$("note").value}`:"")+`\nTotal: ${rp(t)}`;
 window.open(`https://wa.me/${C.wa}?text=${encodeURIComponent(msg)}`,"_blank");
};
const q=new URLSearchParams(location.search).get("meja");if(q)$("meja").value=q;
document.querySelectorAll(".rv").forEach(el=>{const o=new IntersectionObserver(es=>{if(es[0].isIntersecting){el.classList.add("in");o.disconnect()}},{threshold:.15});o.observe(el)});
</script>
</body>
</html>
